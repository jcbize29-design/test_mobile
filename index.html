<style>

  function go(action) {
    if (!action) return;

    const current = location.hash.replace(/^#/, '') || 'menu';

    // The Company Profile tile on About Us opens the internal section.
    if (action === 'companyprofile' && current !== 'companyprofile') {
      history.pushState({ view: 'companyprofile' }, '', '#companyprofile');
      render('companyprofile');
      return;
    }

    // Back arrows return one level in the section hierarchy.
    if (action === 'back') {
      const previousSection = {
        companyprofile: 'about',
        municipalities: 'solutions',
        municipalitiesfull: 'municipalities'
      };
      action = previousSection[current] || 'menu';
    }

    // Home icons always return to the main menu.
    if (action === 'home') action = 'menu';

    if (action === 'email') {
      window.location.href = 'mailto:info@otsteam.gr?cc=daskalakishield@otsteam.gr';
      return;
    }

    if (action === 'video') {
      history.pushState({ view: 'video' }, '', '#video');
      render('video');
      return;
    }

    if (action === 'external') return;
    if (!pages[action]) return;

    history.pushState({ view: action }, '', '#' + action);
    render(action);
  }

  function makeHotspot(h, label) {
    const a = document.createElement('a');
    a.className = 'hotspot';
    a.href = h.uri && h.action === 'external' ? h.uri : (h.action === 'email' ? 'mailto:info@otsteam.gr?cc=daskalakishield@otsteam.gr' : '#' + (h.action || 'home'));
    a.setAttribute('aria-label', label || ('Open ' + (titles[h.action] || h.action || 'link')));
    a.style.left = h.x + '%';
    a.style.top = h.y + '%';
    a.style.width = h.w + '%';
    a.style.height = h.h + '%';
    a.addEventListener('click', function(e) {
      if (h.action === 'external' && h.uri) {
        e.preventDefault();
        if (/^(mailto:|tel:)/i.test(h.uri)) {
          window.location.href = h.uri;
        } else {
          window.open(h.uri, '_blank', 'noopener,noreferrer');
        }
        return;
      }
      e.preventDefault();
      go(h.action);
    });
    return a;
  }

        <a class="mobile-art-hotspot" style="left:8.5%;top:64.2%;width:83.2%;height:5.0%" href="#solutions" data-action="solutions" aria-label="Security solutions"></a>
        <a class="mobile-art-hotspot" style="left:8.5%;top:70.1%;width:83.2%;height:5.1%" href="#founder" data-action="founder" aria-label="Founder and experience"></a>
        <a class="mobile-art-hotspot" style="left:8.5%;top:75.8%;width:83.2%;height:5.2%" href="#methodology" data-action="methodology" aria-label="Methodology and references"></a>
        <a class="mobile-art-hotspot" style="left:8.5%;top:81.8%;width:83.2%;height:5.3%" href="#video" data-action="video" aria-label="Video presentation"></a>
        <a class="mobile-art-hotspot" style="left:8.5%;top:87.8%;width:83.2%;height:5.3%" href="mailto:info@otsteam.gr?cc=daskalakishield@otsteam.gr" data-action="email" aria-label="Contact us"></a>
      </div>`;
    menu.querySelectorAll('[data-action]').forEach(a => a.addEventListener('click', e => {
      const action = a.getAttribute('data-action');
      if (action !== 'email') { e.preventDefault(); go(action); }
    }));
    content.appendChild(menu);
    document.title = 'Strategic Shield Advisors — Main menu';
    window.scrollTo({top:0, behavior:'instant'});
  }

  function render(view) {
    const isSectionView = view !== 'menu' && view !== 'video';
    document.documentElement.classList.toggle('section-view', isSectionView);
    document.body.classList.toggle('section-view', isSectionView);
    if (view !== 'video') video.pause();
    content.innerHTML = '';
    notFound.style.display = 'none';
    if (view === 'video') {
      content.style.display = 'none';
      videoView.style.display = 'flex';
      video.currentTime = 0;
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
      return;
    }
    videoView.style.display = 'none';
    content.style.display = 'flex';
    content.className = '';
    if (view === 'menu' && window.matchMedia('(max-width: 600px)').matches) {
      renderMobileMenu();
      return;
    }
    const imagePages = pages[view];
    if (!imagePages) {
      render('menu');
      return;
    }
    document.title = 'Strategic Shield Advisors — ' + (titles[view] || view);
    imagePages.forEach((p, i) => {
      const frame = document.createElement('section');
      frame.className = 'page-frame' + (view === 'menu' ? ' desktop-menu' : '');
      frame.style.setProperty('--ratio', p.width + ' / ' + p.height);
      frame.style.setProperty('--page-height', '100cqh');
      frame.style.width = 'min(100vw, ' + ((p.width / p.height) * 100).toFixed(5) + 'dvh)';
      const img = document.createElement('img');
      img.src = p.image;
      img.alt = (titles[view] || view) + ', page ' + (i + 1);
      img.draggable = false;
      frame.appendChild(img);
      // Transparent text layer keeps the original artwork unchanged while allowing selection/copy.
      const textSpans = (textLayers[view] && textLayers[view][i]) || [];
      textSpans.forEach(t => {
        const span = document.createElement('span');
        span.className = 'selectable-text';
        span.textContent = t.t;
        span.style.left = t.x + '%'; span.style.top = t.y + '%';
        span.style.width = t.w + '%'; span.style.height = t.h + '%';
        span.style.fontSize = 'calc(100cqh * ' + (t.fs / 100).toFixed(6) + ')';
        span.setAttribute('aria-label', t.t);
        frame.appendChild(span);
      });
      const pageHotspots = (hotspots[view] && hotspots[view][i]) || [];
      pageHotspots.forEach((h, j) => {
        frame.appendChild(makeHotspot(h, h.action === 'home' ? 'Return to previous section or main menu' : undefined));
      });
      content.appendChild(frame);
    });
    window.scrollTo({top:0, behavior:'instant'});
  }

  document.getElementById('video-home').addEventListener('click', () => go('menu'));
  document.getElementById('not-found-home').addEventListener('click', () => go('menu'));
  window.addEventListener('resize', () => { if ((location.hash.replace(/^#/, '') || 'menu') === 'menu') render('menu'); });
  window.addEventListener('popstate', () => {
    const view = location.hash.replace(/^#/, '') || 'menu';
    render(view);
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && location.hash === '#video') go('menu');
  });
  const initial = location.hash.replace(/^#/, '') || 'menu';
  render(initial);
})();
</script>
</body>
</html>
